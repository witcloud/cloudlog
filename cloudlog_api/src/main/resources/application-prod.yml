# ============================================================
# 生产环境覆盖配置（--spring.profiles.active=prod 时生效）
# 只放「与默认配置不同」的收紧项；数据源、Redis、SMTP、MinIO 等仍取 application.yml。
# 本文件会被提交，禁止写入任何真实凭据。
# 对应规则：business-model.md §3.3「运维面收敛」
# ============================================================

springdoc:
  api-docs:
    enabled: false # /v3/api-docs 不再注册，SecurityConfig 同时撤掉三条文档路径的匿名放行
  swagger-ui:
    enabled: false # /swagger-ui.html 与 /swagger-ui/** 不再注册

management:
  endpoints:
    web:
      exposure:
        include: health # actuator 只暴露健康检查，其余端点根本不注册
  health:
    mail:
      # 健康检查不该去连 SMTP：邮箱服务商不可达只是发不出信，不该把整个实例判 DOWN。
      # 编排里这条是硬依赖——/actuator/health 返 503 会让 api 恒 unhealthy，
      # web 的 depends_on: service_healthy 永远等不到（实测占位 SMTP 下启动成功、5 秒后被拖 DOWN）
      enabled: false

# 是否采信 X-Forwarded-For 取来源地址。保持 false 除非确认：8080 只由本机 Nginx 转发、外网直连不到应用进程。
# 一旦客户端能绕过代理直连端口，这个头就是攻击者自填的——登录爆破计数按来源地址分键，
# 换一个头换一个额度，锁定等于不存在；来源地址为 true 时也必须是代理覆盖而非追加
# （proxy_set_header X-Forwarded-For $remote_addr;，写法见 application.example.yml 的 Nginx 参考配置）。
app:
  security:
    trust-forwarded-for: false

# 生产日志：默认配置（application.yml）是开发档的 DEBUG，只进控制台；
# 生产压到 info、落文件并按体积滚动归档，避免 DEBUG 刷屏与重启即丢日志
logging:
  level:
    com.ayun: info
    org.springframework.security: warn
  file:
    # 相对进程工作目录；用 systemd 托管时建议改为绝对路径（如 /var/log/cloudlog/cloudlog.log）
    name: logs/cloudlog.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/cloudlog-%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 1GB
