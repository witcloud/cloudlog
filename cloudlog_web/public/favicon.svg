    与 SiteLogo.vue 中的图形同源同形。
    独立资源无法继承站点 CSS 变量，此处内嵌 token 等值色，并按系统外观切换明暗。
    品牌绿是 Logo 专属资产、不进版面 token，故与 SiteLogo.vue 同值写死。
  -->
