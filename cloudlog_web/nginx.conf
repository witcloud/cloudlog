# ============================================================
# CloudLog 前端站点配置（进 nginx:alpine 的 /etc/nginx/conf.d/default.conf）
#
# 与 README「SEO 产物与反向代理」一节同口径，只有一处差别：compose 拓扑里后端不是
# 127.0.0.1:8080，而是同网络内的服务名 api，且 api 的 8080 不对外发布——nginx 是唯一入口。
#
# 三条 SEO 产物必须用 location = 精确匹配：下面的 try_files 会把任何未命中路径都回落到
# index.html，写成前缀匹配（或干脆不写）时爬虫拿到的是一份 HTML，等于一份「谁都不许抓」的空规则。
# ============================================================

# docker 内置 DNS。带上它并用变量转发，是为了后端容器重启换 IP 后这里能跟着重解析——
# 否则 nginx 只在启动时解析一次服务名，单独重启 api 会让所有接口 502
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 spring.servlet.multipart.max-file-size: 10MB 对齐，多留 2MB 给 multipart 边界开销。
    # 卡成默认 1m 时，超过 1m 的图片会在 nginx 就被挡成空 body 的 413，用户拿不到后端那句中文提示
    client_max_body_size 12m;

    set $api_upstream api;

    # 转发头：站点域名留空时后端按 Host 头兜底拼 sitemap/RSS/robots 里的地址，所以这里用 $http_host
    # 而不是 $host——后者丢掉端口，WEB_PORT 不是 80 时兜底出来的就是打不开的地址。
    # 正式上线应在后台「系统设置 → 站点信息 → 站点域名」写死对外地址，别依赖请求头（README 第 5 步）；
    # X-Forwarded-For 用 $remote_addr 覆盖而不是 $proxy_add_x_forwarded_for 追加——
    # 客户端自报的那一段会被留在链首，而后端取值口径只看链首（application.example.yml 的说明）
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # 爬虫只认域名根上的这三个名字，后端挂在 /api/v1 之下，所以在根上做一次性改名转发
    location = /robots.txt {
        proxy_pass http://$api_upstream:8080/api/v1/robots.txt;
    }

    location = /sitemap.xml {
        proxy_pass http://$api_upstream:8080/api/v1/sitemap.xml;
    }

    location = /feed.xml {
        proxy_pass http://$api_upstream:8080/api/v1/feed.xml;
    }

    # 接口：前缀原样透传（context-path 本身就是 /api/v1，不做 rewrite）。
    # proxy_pass 里出现变量时 nginx 不再自动补路径，所以手写 $request_uri——它自带查询串
    location /api/v1/ {
        proxy_pass http://$api_upstream:8080$request_uri;
    }

    # 单页应用：静态文件命中就发文件，没命中的一律回 index.html，由前端路由决定渲染哪一页
    location / {
        try_files $uri $uri/ /index.html;
    }
}
