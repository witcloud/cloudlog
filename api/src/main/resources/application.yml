spring:
  application:
    name: AyunBlog-Springboot3
  datasource:
    url: jdbc:mysql://localhost:3306/ayun_blog?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
  mail:
    host: smtp.qq.com
    username: 2196065579@qq.com
    password: tpieflwninjadjab
    port: 587
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ayun.entity
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

# JWT Configuration
jwt:
  secret: ayun_blog_secret_key_for_jwt_token_generation_at_least_32_chars
  expiration: 604800 # 7 days in seconds
  header: Authorization
  prefix: "Bearer "

logging:
  level:
    com.ayun: debug
    org.springframework.security: info

server:
  port: 8080
  servlet:
    context-path: /api/v1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

# MinIO Configuration
minio:
  endpoint: http://127.0.0.1:9005
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: cloud-blog
